services:

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-anonpay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-anonpay}
      POSTGRES_DB:       ${POSTGRES_DB:-anonpay}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-anonpay} -d ${POSTGRES_DB:-anonpay}"]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 5s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: on-failure
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL:               ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_PRIVY_APP_ID:          ${NEXT_PUBLIC_PRIVY_APP_ID:-}
        NEXT_PUBLIC_CHAIN_RPC_URL:         ${NEXT_PUBLIC_CHAIN_RPC_URL:-}
        NEXT_PUBLIC_CHAIN_ID:              ${NEXT_PUBLIC_CHAIN_ID:-}
        NEXT_PUBLIC_CHAIN_NAME:            ${NEXT_PUBLIC_CHAIN_NAME:-}
        NEXT_PUBLIC_USDC_CONTRACT_ADDRESS: ${NEXT_PUBLIC_USDC_CONTRACT_ADDRESS:-}
        NEXT_PUBLIC_CHAIN_EXPLORER_URL:    ${NEXT_PUBLIC_CHAIN_EXPLORER_URL:-}
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata: